name: android

on:
  push:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Pinned SHAs (spec: reproducible CI)
      - name: Checkout (android-port)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install pinned SDK components (NDK r29, CMake 3.31.6)
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.31.6" "ndk;29.0.14206865" >/dev/null
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare assets (pak128 + base game data)
        run: |
          set -euxo pipefail
          mkdir -p android/app/src/main/assets
          # pak128 2.10.3 for 125.0 up — URL straight from src/paksetinfo.h (the
          # game's own generated pakset registry), not a random mirror.
          curl -L --retry 3 -o pak128.zip "http://downloads.sourceforge.net/project/simutrans/pak128/pak128%20for%20ST%20125.0%20up%20%282.10.3%29/simupak128-2-1023-for-125-0up.zip"
          SIZE=$(stat -c%s pak128.zip)
          echo "pak128.zip size: $SIZE (expected ~97,565,449)"
          if [ "$SIZE" -lt 90000000 ]; then echo "FATAL: pak128.zip too small"; exit 1; fi
          unzip -t pak128.zip > /dev/null
          unzip -l pak128.zip | head -8 | tee pak128-listing.txt
          mv pak128.zip android/app/src/main/assets/pak128.zip
          # base game data: config/, font/ (BDF fallback), text/ (all languages
          # incl. es.tab), themes/, script/, ai/, music/ — all git-tracked.
          cp -r simutrans android/app/src/main/assets/simutrans
          du -sh android/app/src/main/assets/*

      - name: Build debug APK (arm64-v8a only)
        working-directory: android
        run: |
          set -ux -o pipefail
          chmod +x gradlew
          # DIAG_TOKEN may be empty (first runs before the secret exists) -> uploader disabled, build still succeeds
          ./gradlew --no-daemon --stacktrace assembleDebug -PdiagToken="${{ secrets.DIAG_TOKEN }}" 2>&1 | tee ../gradle-build.log

      - name: Verify APK (native libs, signing, badging)
        run: |
          set -euxo pipefail
          APK="$(find android -path '*build/outputs/apk/debug/*.apk' -type f -print -quit)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | tee apk-listing.txt
          grep -q "lib/arm64-v8a/libmain.so"  apk-listing.txt
          grep -q "lib/arm64-v8a/libSDL2.so"  apk-listing.txt
          grep -q "lib/arm64-v8a/libc++_shared.so" apk-listing.txt
          # Phase 2: the game must ship with its data
          grep -q "assets/pak128.zip" apk-listing.txt
          grep -q "assets/simutrans/config/simuconf.tab" apk-listing.txt
          grep -q "assets/simutrans/text/es.tab" apk-listing.txt
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | sed -n '1,30p' | tee apk-badging.txt
          # fixed debug keystore => every build installs over the previous one
          "$BT/apksigner" verify --print-certs "$APK" | tee apk-certs.txt | head -5
          # Guard (phase-1 incident "app closes instantly on open"): the
          # launchable activity declared in the manifest MUST exist in the dex.
          ACT="$("$BT/aapt" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"
          echo "launchable activity: $ACT"
          test -n "$ACT"
          DESC="L$(echo "$ACT" | tr '.' '/')i"
          DESC="${DESC%i};"
          echo "dex descriptor to find: $DESC"
          rm -rf dexcheck && mkdir dexcheck
          unzip -q "$APK" 'classes*.dex' -d dexcheck
          if ! grep -aqF "$DESC" dexcheck/classes*.dex; then
            echo "FATAL: launchable activity is missing from the dex (instant-close bug)"
            exit 1
          fi
          echo "launchable activity present in dex: OK"

      - name: Publish APK to GitHub Release (latest-debug, stable filename)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          APK="$(find android -path '*build/outputs/apk/debug/*.apk' -type f -print -quit)"
          cp "$APK" simutrans-android-debug.apk
          TAG=latest-debug
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY"; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" \
              --title "Simutrans Android - latest debug build" \
              --notes "Automatic build from android-port. FULL GAME: simutrans + pak128, arm64-v8a, SDL2 software rendering. Fixed debug keystore: installs over previous builds. First launch unpacks the game (a few minutes). Internal versionCode = ${{ github.run_number }}."
          fi
          gh release upload "$TAG" simutrans-android-debug.apk --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Upload APK + diagnostics as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simutrans-android-debug-apk
          path: |
            simutrans-android-debug.apk
            gradle-build.log
            apk-listing.txt
            apk-badging.txt
            apk-certs.txt
            pak128-listing.txt
          if-no-files-found: warn
          retention-days: 14
